<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>火烧云预测</title>
<style>
:root{--bg:#f5f7fa;--ink:#1f2733;--muted:#5b6776;--line:#e2e8f0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
/* 顶部工具栏：城市（可搜索）/ 开始日期 / 结束日期 / 最后更新时间 */
.bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
  padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.bar label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
select,input[type=date]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--ink);outline:none}
select:focus,input[type=date]:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.combo{position:relative;display:inline-block}
.combo input{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--ink);outline:none;width:170px}
.combo input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.combo-list{position:absolute;z-index:50;top:100%;left:0;min-width:200px;max-height:260px;overflow:auto;
  background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);margin-top:4px}
.combo-list .ci{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f1f5f9;
  display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.combo-list .ci:last-child{border-bottom:none}
.combo-list .ci:hover,.combo-list .ci.on{background:#eff6ff}
.combo-list .ci small{color:#94a3b8;margin-left:8px;font-variant-numeric:tabular-nums}
.combo-list .ci.empty{color:#94a3b8;cursor:default}
.upd{font-size:12px;color:#64748b;white-space:nowrap}
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.dsum-hd{font-size:13px;font-weight:700;margin:0 0 7px;color:var(--ink)}
.dsum-hd .dsum-meta{font-weight:500;font-size:12.5px;color:#475569}
.sec{margin:0 0 18px}
.scroll{overflow:auto;max-height:76vh;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;min-width:100%;font-size:12.5px}
/* 表头：深蓝分级配色（与 PHP 主表一致） */
thead th{position:sticky;top:0;background:#0f172a;color:#fff;font-weight:600;padding:7px 9px;text-align:center;
  border:1px solid #1e293b;white-space:nowrap;z-index:2}
thead th.time{background:#1e293b;left:0;z-index:3;text-align:left}
thead th.group{background:#1e3a8a}
thead tr:last-child th{top:34px;z-index:2;background:#0f172a}
tbody th.time{position:sticky;left:0;background:#f8fafc;z-index:1;text-align:left;border:1px solid var(--line);
  font-weight:600;white-space:nowrap;padding:6px 9px}
tbody tr:nth-child(even) th.time{background:#eef2f7}
th.time .wk{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:#2563eb;background:#eff6ff;
  border-radius:6px;padding:1px 6px;vertical-align:middle}
tbody td{padding:0;border:1px solid var(--line);text-align:center;height:34px;font-variant-numeric:tabular-nums}
td .v{display:block;padding:6px 4px}
td .v.wx{white-space:nowrap;font-weight:600;padding:6px 8px}
.cold-i{color:#1d4ed8;font-size:11px;font-weight:600;white-space:nowrap}
td.wind{white-space:nowrap;font-size:11.5px;color:#334155;font-variant-numeric:tabular-nums}
.warr{display:inline-block;margin-right:3px;font-weight:700;color:#2563eb;font-size:12px;vertical-align:-1px}
td.lcl{font-variant-numeric:tabular-nums;white-space:nowrap;color:#475569}
.lcl-lo{color:#dc2626 !important;font-weight:700}
.lcl-hi{color:#15803d !important;font-weight:700}
tbody tr.hr:hover{background:#f0f9ff}
tbody tr.hr:hover th.time{background:#dbeafe !important}
/* 日期分隔：每天第一行加粗黑色上边框（与 PHP day-first 一致） */
tbody tr.day-first td,
tbody tr.day-first th.time{border-top:3.5px solid #000}
.fire-bad{color:#fff;background:#f97316;font-weight:700;border-radius:6px;padding:3px 6px;display:inline-block}
.fire-mid{background:#fef3c7;color:#92400e;border-radius:6px;padding:3px 6px;display:inline-block}
.fire-low{background:#ffedd5;color:#9a3412;border-radius:6px;padding:3px 6px;display:inline-block}
.fire-no{color:#94a3b8}
.fx-none{background:#f1f5f9;color:#94a3b8}
.fx-t1{background:#fff7ed;color:#c2410c}
.fx-t2{background:#ffedd5;color:#c2410c}
.fx-t3{background:#fed7aa;color:#9a3412}
.fx-t4{background:#fb923c;color:#7c2d12}
.fx-t5{background:linear-gradient(120deg,#c2410c,#f97316);color:#fff}
/* 按日速览表：与 PHP table.dsum 一致 */
table.dsum{border-collapse:collapse;font-size:12.5px;width:50%;min-width:0}
table.dsum th,table.dsum td{border:1px solid var(--line);padding:5px 9px;text-align:center;white-space:nowrap}
table.dsum thead th{background:#0f172a;color:#fff;font-weight:600}
table.dsum thead tr:first-child th{background:#1e3a8a}
table.dsum thead th .dsum-avg{color:#fde047;font-weight:600}
table.dsum td.dsum-d{text-align:right;font-weight:600;background:#f8fafc}
.dsum-wx{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;vertical-align:1px}
.dsum-cold{color:#1d4ed8;font-size:10.5px;font-weight:600;white-space:nowrap}
table.dsum tbody tr:hover td{background:#eff6ff}
table.dsum tbody tr:hover td.dsum-d{background:#dbeafe}
@media (max-width:640px){table.dsum{width:100%}}
.empty{padding:64px 20px;text-align:center;color:#94a3b8;font-size:15px;background:#fff;
  border:1px dashed #d7dde5;border-radius:12px}
</style>
</head>
<body>
<div class="bar">
  <label>城市<span class="combo"><input type="text" id="cityIn" autocomplete="off" placeholder="中文或拼音搜索"><div class="combo-list" id="cityList" style="display:none"></div></span></label>
  <label>开始日期<input type="date" id="start"></label>
  <label>结束日期<input type="date" id="end"></label>
  <span class="upd" id="upd"></span>
</div>
<main id="out"></main>

<script>
(function () {
  var DATA = { cities: {} };
  try { DATA = JSON.parse(document.getElementById('cc-data').textContent); } catch (e) {}
  var CITIES = DATA.cities || {};
  var KEYS = Object.keys(CITIES);
  var $in = document.getElementById('cityIn');
  var $list = document.getElementById('cityList');
  var $start = document.getElementById('start');
  var $end = document.getElementById('end');
  var $upd = document.getElementById('upd');
  var $out = document.getElementById('out');

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function sty(s) { return s ? ' style="' + esc(s) + '"' : ''; }
  function emptyBox() { return '<div class="empty">无数据</div>'; }
  function fxSpan(o) {
    if (!o || !o.t) return '<span style="color:#94a3b8">—</span>';
    return '<span class="' + esc(o.cls || 'fx-none') + '" style="font-weight:700">' + esc(o.t) + '</span>';
  }
  function fireSpan(o) {
    if (!o || !o.t) return '<span class="fire-no">—</span>';
    return '<span class="' + esc(o.cls || 'fire-no') + '">' + esc(o.t) + '</span>';
  }
  /* ---- cookie：记住最后一次选择的城市 ---- */
  function getCookie(k) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  function setCookie(k, v) {
    document.cookie = k + '=' + encodeURIComponent(v) + ';path=/;max-age=31536000';
  }
  /* ---- 城市搜索：中文包含、拼音前缀/包含、拼音按字母序子串（gz→guangzhou） ---- */
  function subseq(p, q) {
    p = p.toLowerCase(); q = q.toLowerCase();
    var i = 0;
    for (var j = 0; j < p.length && i < q.length; j++) { if (p.charAt(j) === q.charAt(i)) i++; }
    return i === q.length;
  }
  function matchCity(k, q) {
    if (!q) return true;
    var py = ((CITIES[k] && CITIES[k].pinyin) || '').toLowerCase();
    return k.toLowerCase().indexOf(q) >= 0 || py.indexOf(q) >= 0 || subseq(py, q);
  }
  function renderList() {
    var q = $in.value.trim().toLowerCase();
    var ks = KEYS.filter(function (k) { return matchCity(k, q); });
    if (!ks.length) {
      $list.innerHTML = '<div class="ci empty">无匹配城市</div>';
    } else {
      $list.innerHTML = ks.map(function (k) {
        return '<div class="ci" data-k="' + esc(k) + '">' + esc(k) +
          '<small>' + esc((CITIES[k] && CITIES[k].pinyin) || '') + '</small></div>';
      }).join('');
    }
    $list.style.display = 'block';
  }
  function hideList() { $list.style.display = 'none'; }

  /* ---- 按日速览（无低云遮挡列，与 PHP showBlock=0 口径一致） ---- */
  function daysTable(c, days) {
    var h = '<section class="sec"><div class="dsum-hd">【按日速览】<span class="dsum-meta">城市：' +
      esc(c.city) + '，模型：' + esc(c.model || '—') + '</span></div>' +
      '<div class="scroll" style="max-height:none"><table class="dsum"><thead>' +
      '<tr><th rowspan="2">日期</th>' +
      '<th colspan="2">日出 (<span class="dsum-avg">' + esc(c.sunrise || '—') + '</span>)</th>' +
      '<th colspan="2">日落 (<span class="dsum-avg">' + esc(c.sunset || '—') + '</span>)</th></tr>' +
      '<tr><th>天气</th><th>火烧云预测(综合)</th><th>天气</th><th>火烧云预测(综合)</th></tr></thead><tbody>';
    days.forEach(function (d) {
      h += '<tr><td class="dsum-d">' + esc(d.label || d.date) + '</td>';
      ['rise', 'set'].forEach(function (k) {
        var o = d[k];
        if (!o) { h += '<td>—</td><td>—</td>'; return; }
        h += '<td><span class="dsum-wx"' +
          (o.bg ? ' style="background:' + esc(o.bg) + ';color:' + esc(o.fg || '#1f2733') + '"' : '') + '>' +
          esc(o.wx || '—') + '</span>' +
          (o.cold ? '<span class="dsum-cold">，' + esc(o.cold) + '</span>' : '') + '</td>' +
          '<td class="cor">' + fxSpan(o.comp) + '</td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div></section>';
  }

  /* ---- 逐小时明细（无低云遮挡列；表头配色与 PHP 一致；每天首行黑色分隔线） ---- */
  function hoursTable(hours) {
    var h = '<section class="sec"><div class="dsum-hd">【逐小时明细】</div><div class="scroll"><table><thead>' +
      '<tr><th class="time" rowspan="2">时间</th>' +
      '<th class="group" colspan="9">ICON · DWD 德国</th>' +
      '<th rowspan="2" style="background:#0f766e">云底<br>高度</th>' +
      '<th rowspan="2" style="background:#7c2d12">火烧云<br>指数</th>' +
      '<th rowspan="2" style="background:#475569">修正</th>' +
      '<th rowspan="2" style="background:#1d4ed8">综合</th></tr>' +
      '<tr><th>天气</th><th>风向(风力)</th><th>低云</th><th>中云</th><th>高云</th><th>总云量</th>' +
      '<th>湿度</th><th>能见度</th><th style="background:#6d28d9">气溶胶<br>AOD</th></tr></thead><tbody>';
    var prev = '';
    hours.forEach(function (r) {
      var df = (prev !== '' && r.date !== prev) ? ' day-first' : '';
      prev = r.date;
      var w = (r.windDeg !== null && r.windDeg !== undefined && r.wind)
        ? '<span class="warr" style="transform:rotate(' + esc(r.windDeg) + 'deg)">↑</span>' + esc(r.wind)
        : (r.wind || '—');
      function vc(v, s) {
        return '<td><span class="v"' + sty(s) + '>' + (v === null || v === undefined || v === '' ? '—' : esc(v)) + '</span></td>';
      }
      h += '<tr class="hr' + df + '">' +
        '<th class="time">' + esc(r.time) + (r.dow ? '<span class="wk">' + esc(r.dow) + '</span>' : '') + '</th>' +
        '<td><span class="v wx"' +
          (r.wxBg ? ' style="background:' + esc(r.wxBg) + ';color:' + esc(r.wxFg || '#1f2733') + ';display:inline-block"' : ' style="display:inline-block"') +
          '>' + esc(r.wx || '—') + '</span>' +
          (r.cold ? '<span class="cold-i">，' + esc(r.cold) + '</span>' : '') + '</td>' +
        '<td class="wind">' + w + '</td>' +
        vc(r.low, r.lowS) +
        vc(r.mid, r.midS) +
        vc(r.high, r.highS) +
        vc(r.total, r.totS) +
        vc(r.hum, r.humS) +
        vc(r.vis, r.visS) +
        vc(r.aod, r.aodS) +
        '<td class="lcl ' + esc(r.lclC || '') + '">' + (r.lcl ? esc(r.lcl) : '—') + '</td>' +
        '<td>' + fireSpan(r.idx) + '</td>' +
        '<td>' + fireSpan(r.mod) + '</td>' +
        '<td class="cor">' + fxSpan(r.comp) + '</td>' +
        '</tr>';
    });
    return h + '</tbody></table></div></section>';
  }

  function render() {
    var c = CITIES[$in.value.trim()];
    if (!c) { $out.innerHTML = emptyBox(); return; }
    var s = $start.value, e = $end.value;
    var days = (c.days || []).filter(function (d) { return (!s || d.date >= s) && (!e || d.date <= e); });
    var hours = (c.hours || []).filter(function (r) { return (!s || r.date >= s) && (!e || r.date <= e); });
    if (!days.length && !hours.length) { $out.innerHTML = emptyBox(); return; }
    var html = '';
    if (days.length) html += daysTable(c, days);
    if (hours.length) html += hoursTable(hours);
    $out.innerHTML = html;
  }

  /* ---- 选中城市：更新日期范围、更新时间、cookie，并渲染 ---- */
  function setCity(k) {
    $in.value = k;
    setCookie('cc_city', k);
    var c = CITIES[k];
    $upd.textContent = '更新 ' + (c && c.fetched ? c.fetched : '—');
    if (c) {
      $start.min = $end.min = c.start || '';
      $start.max = $end.max = c.end || '';
      $start.value = c.start || '';
      $end.value = c.end || '';
    }
    render();
  }

  /* ---- 组合框事件 ---- */
  $in.addEventListener('focus', renderList);
  $in.addEventListener('input', renderList);
  $in.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      var ks = KEYS.filter(function (k) { return matchCity(k, $in.value.trim().toLowerCase()); });
      if (ks.length) { setCity(ks[0]); hideList(); }
      ev.preventDefault();
    } else if (ev.key === 'Escape') { hideList(); }
  });
  $list.addEventListener('mousedown', function (ev) {
    var ci = ev.target.closest('.ci');
    if (ci && ci.dataset && ci.dataset.k) { setCity(ci.dataset.k); hideList(); ev.preventDefault(); }
  });
  $in.addEventListener('blur', function () { setTimeout(hideList, 150); });
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest || !ev.target.closest('.combo')) hideList();
  });

  $start.addEventListener('change', render);
  $end.addEventListener('change', render);

  if (!KEYS.length) {
    $out.innerHTML = emptyBox();
    $upd.textContent = '';
    return;
  }
  /* 默认打开 cookie 里最后一次选择的城市 */
  var last = getCookie('cc_city');
  setCity(KEYS.indexOf(last) >= 0 ? last : KEYS[0]);
})();
</script>
</body>
</html>
