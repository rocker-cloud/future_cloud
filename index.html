<title>火烧云预测</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
     color:#0f172a;background:#f5f6f8;-webkit-text-size-adjust:100%}
.bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
     padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.bar label{display:flex;align-items:center;gap:6px;font-size:13px;color:#475569;white-space:nowrap}
select,input[type=date]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #cbd5e1;border-radius:8px;
     background:#fff;color:#0f172a;outline:none}
select:focus,input[type=date]:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
main{padding:14px 14px 40px}
.sec{margin:0 0 22px}
.sec>h2{margin:0 0 8px;font-size:13px;font-weight:600;color:#334155;letter-spacing:.5px}
.sec>h2 span{font-weight:400;color:#94a3b8;margin-left:8px}
.tw{overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:7px 10px;text-align:center;border-bottom:1px solid #eef1f5}
thead th{position:sticky;top:0;z-index:2;background:#f8fafc;color:#475569;font-weight:600;font-size:12px;
        border-bottom:1px solid #e2e8f0}
thead tr:nth-child(2) th{top:31px}
tbody tr:hover td{background:#fafbfc}
tbody tr:last-child td{border-bottom:none}
td.d{text-align:left;color:#334155;font-weight:600}
td.t{text-align:left;color:#1e293b;font-weight:600}
td.t .wk{margin-left:6px;font-weight:400;color:#94a3b8;font-size:11.5px}
td.wx{text-align:left}
.wxpill{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:#eef2f7;color:#334155;vertical-align:1px}
.cold{margin-left:4px;font-size:11.5px;color:#64748b}
.wa{display:inline-block;margin-right:3px;font-weight:700;color:#2563eb;font-size:12px}
.wt{color:#334155}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px;line-height:1.5}
.fx-none{background:#f1f5f9;color:#94a3b8}
.fx-t1{background:#fff7ed;color:#c2410c}
.fx-t2{background:#ffedd5;color:#c2410c}
.fx-t3{background:#fed7aa;color:#9a3412}
.fx-t4{background:#fb923c;color:#7c2d12}
.fx-t5{background:linear-gradient(120deg,#c2410c,#f97316);color:#fff}
.fire-bad{background:#fee2e2;color:#b91c1c}
.fire-mid{background:#fef3c7;color:#92400e}
.fire-low{background:#ffedd5;color:#9a3412}
.fire-no{color:#94a3b8}
.num{font-variant-numeric:tabular-nums}
.mut{color:#94a3b8}
.empty{padding:64px 20px;text-align:center;color:#94a3b8;font-size:15px;background:#fff;
       border:1px dashed #d7dde5;border-radius:12px}
@media (max-width:640px){
  table{font-size:12px}
  th,td{padding:6px 7px}
  main{padding:10px 8px 30px}
}
</style>
</head>

<script>
(function () {
  var DATA = { cities: {} };
  try { DATA = JSON.parse(document.getElementById('cc-data').textContent); } catch (e) {}
  var CITIES = DATA.cities || {};
  var KEYS = Object.keys(CITIES);
  var $city = document.getElementById('city');
  var $start = document.getElementById('start');
  var $end = document.getElementById('end');
  var $out = document.getElementById('out');

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function num(v, unit) {
    if (v === null || v === undefined || v === '') return '<span class="mut">—</span>';
    return '<span class="num">' + esc(v) + (unit || '') + '</span>';
  }
  function pill(o) {
    if (!o || !o.t) return '<span class="mut">—</span>';
    return '<span class="pill ' + esc(o.cls || 'fx-none') + '">' + esc(o.t) + '</span>';
  }
  function wxCell(o) {
    var s = '<span class="wxpill"' +
      (o.bg ? ' style="background:' + esc(o.bg) + ';color:' + esc(o.fg || '#1e293b') + '"' : '') + '>' +
      esc(o.wx || '—') + '</span>';
    if (o.cold) s += '<span class="cold">，' + esc(o.cold) + '</span>';
    return s;
  }
  function blkCell(v, c) {
    if (v === null || v === undefined) return '<span class="mut">—</span>';
    var col = c || (v > 50 ? '#b91c1c' : (v > 25 ? '#b45309' : '#16a34a'));
    return '<span class="num" style="color:' + esc(col) + ';font-weight:700">' + esc(v) + '%</span>';
  }
  function emptyBox() { return '<div class="empty">无数据</div>'; }

  function daysTable(c, days) {
    var h = '<section class="sec"><h2>按日速览</h2><div class="tw"><table><thead>' +
      '<tr><th rowspan="2">日期</th>' +
      '<th colspan="3">日出' + (c.sunrise ? ' (' + esc(c.sunrise) + ')' : '') + '</th>' +
      '<th colspan="3">日落' + (c.sunset ? ' (' + esc(c.sunset) + ')' : '') + '</th></tr>' +
      '<tr><th>天气</th><th>低云遮挡</th><th>火烧云预测(综合)</th>' +
      '<th>天气</th><th>低云遮挡</th><th>火烧云预测(综合)</th></tr></thead><tbody>';
    days.forEach(function (d) {
      h += '<tr><td class="d">' + esc(d.label || d.date) + '</td>';
      ['rise', 'set'].forEach(function (k) {
        var o = d[k];
        if (!o) { h += '<td class="mut">—</td><td class="mut">—</td><td class="mut">—</td>'; return; }
        h += '<td class="wx">' + wxCell(o) + '</td>' +
             '<td>' + blkCell(o.blk, o.blkC) + '</td>' +
             '<td>' + pill(o.comp) + '</td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div></section>';
  }

  function hoursTable(hours) {
    var h = '<section class="sec"><h2>逐小时明细</h2><div class="tw"><table><thead><tr>' +
      '<th>时间</th><th>天气</th><th>风向(风力)</th><th>低云</th><th>中云</th><th>高云</th>' +
      '<th>总云量</th><th>湿度</th><th>能见度</th><th>AOD</th><th>云底高度</th>' +
      '<th>低云遮挡</th><th>火烧云指数</th><th>修正</th><th>综合</th></tr></thead><tbody>';
    hours.forEach(function (r) {
      var w = '';
      if (r.wind) {
        w = (r.windDeg !== null && r.windDeg !== undefined
              ? '<span class="wa" style="transform:rotate(' + esc(r.windDeg) + 'deg)">↑</span>' : '') +
            '<span class="wt">' + esc(r.wind) + '</span>';
      } else { w = '<span class="mut">—</span>'; }
      h += '<tr>' +
        '<td class="t">' + esc(r.time) + (r.dow ? '<span class="wk">' + esc(r.dow) + '</span>' : '') + '</td>' +
        '<td class="wx">' + wxCell(r) + '</td>' +
        '<td>' + w + '</td>' +
        '<td>' + num(r.low, '%') + '</td>' +
        '<td>' + num(r.mid, '%') + '</td>' +
        '<td>' + num(r.high, '%') + '</td>' +
        '<td>' + num(r.total, '%') + '</td>' +
        '<td>' + num(r.hum, '%') + '</td>' +
        '<td>' + (r.vis ? '<span class="num">' + esc(r.vis) + '</span>' : '<span class="mut">—</span>') + '</td>' +
        '<td>' + num(r.aod) + '</td>' +
        '<td>' + (r.lcl ? '<span class="num">' + esc(r.lcl) + '</span>' : '<span class="mut">—</span>') + '</td>' +
        '<td>' + blkCell(r.blk, r.blkC) + '</td>' +
        '<td>' + pill(r.idx) + '</td>' +
        '<td>' + (r.mod && r.mod.t ? '<span class="pill ' + esc(r.mod.cls || 'fx-none') + '">' + esc(r.mod.t) + '</span>' : '<span class="mut">—</span>') + '</td>' +
        '<td>' + pill(r.comp) + '</td>' +
        '</tr>';
    });
    return h + '</tbody></table></div></section>';
  }

  function render() {
    if (!KEYS.length) { $out.innerHTML = emptyBox(); return; }
    var c = CITIES[$city.value];
    if (!c) { $out.innerHTML = emptyBox(); return; }
    var s = $start.value, e = $end.value;
    var days = (c.days || []).filter(function (d) { return (!s || d.date >= s) && (!e || d.date <= e); });
    var hours = (c.hours || []).filter(function (r) { return (!s || r.date >= s) && (!e || r.date <= e); });
    if (!days.length && !hours.length) { $out.innerHTML = emptyBox(); return; }
    var html = '';
    if (days.length) html += daysTable(c, days);
    if (hours.length) html += hoursTable(hours);
    $out.innerHTML = html;
  }

  if (!KEYS.length) {
    $out.innerHTML = emptyBox();
    return;
  }
  KEYS.forEach(function (k) {
    var op = document.createElement('option');
    op.value = k; op.textContent = k;
    $city.appendChild(op);
  });
  $city.value = KEYS[0];

  function applyCity() {
    var c = CITIES[$city.value];
    if (!c) { $out.innerHTML = emptyBox(); return; }
    $start.min = $end.min = c.start || '';
    $start.max = $end.max = c.end || '';
    $start.value = c.start || '';
    $end.value = c.end || '';
    render();
  }
  $city.addEventListener('change', applyCity);
  $start.addEventListener('change', render);
  $end.addEventListener('change', render);
  applyCity();
})();
</script>
